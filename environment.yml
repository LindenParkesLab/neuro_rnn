# Conda environment for the neuro_rnn analyses.
#
#   conda env create -f environment.yml
#   conda activate neuro_rnn
#   pip install -e .
#
# Conda supplies only the Python interpreter; every library is installed by pip
# from requirements.txt. Keeping a single resolver in charge of the dependency
# graph is deliberate -- neurogym hard-pins numpy/scipy/matplotlib, and letting
# conda and pip each resolve part of the stack is what produces version clashes.
#
# Runs on macOS (Apple silicon, `mps`) and Linux (`cpu`/`cuda`). The pinned
# torch build is the default CPU/MPS wheel; for an NVIDIA GPU, install the
# matching CUDA build of torch 2.7.1 afterwards, per https://pytorch.org.

name: neuro_rnn

channels:
  - conda-forge

dependencies:
  - python=3.12.11
  - pip
  - pip:
      - -r requirements.txt
